<style>

/* Tooltip */

/* Layout: full-height map app; top bar + chip rail float over the map, sheets slide up from the bottom. */
:root{
  --ink:#16233b; --ink-2:#4a5670; --ink-3:#7c869a;
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#e9edf3; --line:#d6dce6;
  --accent:#b9781f; --accent-ink:#ffffff; --accent-soft:#f6ead6;
  --mosque:#1f5c7a; --business:#b9781f; --public:#4d7a3a;
  --ok:#2f7a4f; --warn:#a8641a; --bad:#b23b3b;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 8px 28px rgba(22,35,59,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e8ecf4; --ink-2:#b3bccb; --ink-3:#8590a4;
  --bg:#0f1624; --surface:#18212f; --surface-2:#222d3e; --line:#2e3a4d;
  --accent:#e0a14a; --accent-ink:#1a1206; --accent-soft:#3a2c17;
  --mosque:#5fa6c9; --business:#e0a14a; --public:#86b86f;
  --ok:#5fbf86; --warn:#e0a14a; --bad:#e47a7a; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e8ecf4; --ink-2:#b3bccb; --ink-3:#8590a4;
  --bg:#0f1624; --surface:#18212f; --surface-2:#222d3e; --line:#2e3a4d;
  --accent:#e0a14a; --accent-ink:#1a1206; --accent-soft:#3a2c17;
  --mosque:#5fa6c9; --business:#e0a14a; --public:#86b86f;
  --ok:#5fbf86; --warn:#e0a14a; --bad:#e47a7a; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
#app{overflow:hidden}
@media (max-width:520px){.brand{padding:6px}.brand .bt{display:none}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#map{position:absolute;inset:0;background:var(--surface-2);direction:ltr}
[dir="rtl"] body{font-family:"Noto Kufi Arabic",var(--body)}
[dir="rtl"] .dname,[dir="rtl"] .panel-head h2,[dir="rtl"] .sheet-head h2,[dir="rtl"] .brand{font-family:"Noto Kufi Arabic",var(--display)}
[dir="rtl"] .back svg{transform:scaleX(-1)}
[dir="rtl"] h3{letter-spacing:0}
:root[data-theme="dark"] .leaflet-tile-pane{filter:brightness(.72) contrast(1.05) saturate(.7)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:brightness(.72) contrast(1.05) saturate(.7)}}
.leaflet-container{font-family:var(--body);background:var(--surface-2)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--ink-3)!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-control-zoom{display:none}

/* top */
.top{position:absolute;z-index:500;left:0;right:0;top:0;padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;box-shadow:var(--shadow);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand .mk{width:28px;height:28px;border-radius:50%;background:var(--ink);display:grid;place-items:center}

let PLACES=[...EX,...MOSQ];
const LUX=[49.6116,6.1319];
function dist(a,b){const R=6371,dLa=(b[0]-a[0])*Math.PI/180,dLo=(b[1]-a[1])*Math.PI/180,x=Math.sin(dLa/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
let USER=null, USER_ACC=0;
function origin(){if(USER)return USER;if(typeof map!=="undefined"){const c=map.getCenter();return [c.lat,c.lng]}return LUX}
function isOpen(p){if(!p.open)return null;const d=new Date(),h=d.getHours()+d.getMinutes()/60;return h>=p.open[0]&&h<p.open[1]}
const nameOf=p=>p.name||(lang==="ar"?"مسجد (بدون اسم على OSM)":"Mosque (unnamed on OSM)");

// ---------- state ----------
const F0={kind:"all",mosques:false,space:[],am:[],openNow:false,minR:0,conf:false,dist:0,btype:[],ptype:[]};
let F=JSON.parse(JSON.stringify(F0)), sort="nearest", query="", selected=null;
function activeCount(){return F.space.length+F.am.length+(F.openNow?1:0)+(F.minR?1:0)+(F.conf?1:0)+(F.dist?1:0)+F.btype.length+F.ptype.length}
function filtered(){
  const q=query.trim().toLowerCase();
  const o=origin(); PLACES.forEach(p=>p.km=dist(o,[p.lat,p.lon]));
  let r=PLACES.filter(p=>{
    if(p.kind==="mosque"){if(!F.mosques)return false}else if(F.kind!=="all"&&p.kind!==F.kind)return false;
    if(q&&!(`${nameOf(p)} ${p.city||""} ${p.street||""}`.toLowerCase().includes(q)))return false;
    if(F.space.length&&!F.space.includes(p.space))return false;
    if(F.am.length&&!F.am.every(a=>p.am[a]))return false;
    if(F.openNow&&isOpen(p)!==true)return false;
    if(F.minR&&p.rating<F.minR)return false;
    if(F.conf&&!(p.conf!=null&&p.conf<=30))return false;
    if(F.dist&&p.km>F.dist)return false;
    if(F.btype.length&&p.kind==="business"&&!F.btype.includes(p.type))return false;
    if(F.ptype.length&&p.kind==="public"&&!F.ptype.includes(p.type))return false;
    return true});
  if(sort==="nearest")r.sort((a,b)=>a.km-b.km);
  if(sort==="rating")r.sort((a,b)=>b.rating-a.rating||b.rc-a.rc);
  if(sort==="recent")r.sort((a,b)=>(a.conf??1e9)-(b.conf??1e9));
  return r;
}

const Local=L.TileLayer.extend({getTileUrl(c){const k=`${c.z}_${c.x}_${c.y}`;return TILES[k]?"data:image/jpeg;base64,"+TILES[k]:BLANK}});
const EMBED=Object.keys(TILES).length>0, MAXZ=EMBED?13:19;

const map=L.map("map",EMBED?{zoomControl:false,minZoom:7,maxZoom:13,maxBounds:[[48.6,4.9],[50.6,7.7]],maxBoundsViscosity:.8}:{zoomControl:false,minZoom:3,maxZoom:19}).setView([49.58,6.08],10);
(EMBED?new Local("",{maxNativeZoom:13,minZoom:7,maxZoom:13,attribution:ATTR}):L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:ATTR})).addTo(map);
map.attributionControl.setPrefix(false);
const layer=L.layerGroup().addTo(map); const markers={};
function drawMarkers(list){layer.clearLayers();list.forEach(p=>{const m=L.marker([p.lat,p.lon],{icon:L.divIcon({html:pinHTML(p,selected===p.id),className:"",iconSize:[34,42],iconAnchor:[17,41]}),title:nameOf(p),keyboard:true});m.on("click",()=>openDetail(p.id));m.addTo(layer);markers[p.id]=m})}

const $=s=>document.querySelector(s);
function stars(r){const f=Math.round(r);return "★".repeat(f)+"☆".repeat(5-f)}
function kindLabel(p){return p.kind==="mosque"?T("kMosque"):T(p.type)}
function spaceLabel(s){return s?T(s):null}
function cardHTML(p){
  const tags=[];
  if(p.example)tags.push(`<span class="tag ex">${T("example")}</span>`);
  if(p.source==="osm")tags.push(`<span class="tag osm">${T("unreviewed")}</span>`);
  if(p.space)tags.push(`<span class="tag">${spaceLabel(p.space)}</span>`);
  if(p.cap)tags.push(`<span class="tag">👥 ${T("capN",p.cap)}</span>`);
  if(p.conf!=null&&p.conf<=30)tags.push(`<span class="tag fresh">${T("lastConf",p.conf)}</span>`);
  return `<button class="card" data-id="${p.id}"><span class="thumb" style="background:${COL[p.kind]}">${glyph(p.kind)}</span><span class="t"><span class="name">${esc(nameOf(p))}</span><span class="meta"><span>${kindLabel(p)}</span>·<span>${p.km.toFixed(1)} km</span>${p.rc?`·<span class="stars">${stars(p.rating)}</span><span>${p.rating.toFixed(1)} (${p.rc})</span>`:""}</span><span class="meta">${tags.join("")}</span></span></button>`}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T(e.dataset.t));
  $("#q").placeholder=T("search"); $("#langBtn").textContent=lang==="en"?"عربي":"EN";document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("#kindChips").innerHTML=["all","business","public"].map(k=>`<button class="chip" data-kind="${k}" aria-pressed="${F.kind===k}">${k!=="all"?`<span class="dot" style="background:${COL[k]}"></span>`:""}${T(k)}</button>`).join("")+`<button class="chip" id="mosqChip" aria-pressed="${F.mosques}"><span class="dot" style="background:${COL.mosque}"></span>${T("mosque")}</button>`;
  $("#sort").innerHTML=[["nearest",T("nearest")],["rating",T("rating")],["recent",T("recent")]].map(([v,l])=>`<option value="${v}" ${sort===v?"selected":""}>${l}</option>`).join("");
  const n=activeCount(); $("#fcount").hidden=!n; $("#fcount").textContent=n;
  const r=filtered(); $("#countTitle").textContent=T("places",r.length); $("#countSub").textContent=USER?T("fromYou"):T("fromCentre");if($("#locBannerText"))$("#locBannerText").textContent=T(typeof locMsg!=="undefined"?locMsg:"locBanner");
  $("#list").innerHTML=`<div class="demo-ribbon">${T("demoBanner")}</div>`+(r.length?r.map(cardHTML).join(""):`<div class="empty">${T("noRes")}<br><br><button class="btn sm" id="clearF">${T("clear")}</button></div>`);
  drawMarkers(r); renderFilters(); $("#applyF").textContent=T("show",r.length);
}
function optGroup(title,key,vals,multi=true){return `<section><h3>${title}</h3><div class="opts">${vals.map(([v,l])=>{const on=multi?F[key].includes(v):F[key]===v;return `<button class="opt" data-f="${key}" data-v="${v}" data-m="${multi}" aria-pressed="${on}">${l}</button>`}).join("")}</div></section>`}
function renderFilters(){
  $("#filterBody").innerHTML=
   optGroup(T("space"),"space",[["men",T("men")],["women",T("women")],["both",T("both")]])+
   optGroup(T("amenities"),"am",AM.map(a=>[a,T(a)]))+
   `<section><h3>${T("openNow")}</h3><div class="opts"><button class="opt" data-f="openNow" data-v="1" data-m="bool" aria-pressed="${F.openNow}">${T("openNow")}</button><button class="opt" data-f="conf" data-v="1" data-m="bool" aria-pressed="${F.conf}">${T("confirmed")}</button></div></section>`+
   optGroup(T("minRating"),"minR",[[0,T("any")],[3,"3+ ★"],[4,"4+ ★"],[4.5,"4.5+ ★"]],false)+
   optGroup(T("distance"),"dist",[[0,T("anyDist")],[5,"5 km"],[10,"10 km"],[25,"25 km"],[50,"50 km"]],false)+
   optGroup(T("btype"),"btype",["cafe","restaurant","shop","warehouse","association"].map(v=>[v,T(v)]))+
   optGroup(T("ptype"),"ptype",["park","hospital","station","mall","university"].map(v=>[v,T(v)]));
}

const radios=(name,vals,sel)=>`<div class="opts" data-group="${name}">${vals.map(([v,l])=>`<label class="opt"><input type="radio" name="${name}" value="${v}" ${sel===v?"checked":""}>${l}</label>`).join("")}</div>`;
const TYPES=k=>k==="business"?["cafe","restaurant","shop","warehouse","association","other"]:["park","hospital","station","mall","university","other"];
function openAddForm(p,owner){
  $("#fTitle").textContent=T("addTitle");
  $("#formBody").innerHTML=`<form id="addForm" action="${FORM_ACTION}" method="POST" enctype="multipart/form-data" novalidate>
  <input type="hidden" name="_subject" value="PrayerAid: new place submitted">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <input type="hidden" name="_next" value="${location.origin+location.pathname}#sent">
  <input type="hidden" name="app_language" value="${lang}">
  <input type="hidden" name="latitude" id="afLat"><input type="hidden" name="longitude" id="afLon"><input type="hidden" name="map_link" id="afLink">
  ${p?`<input type="hidden" name="existing_listing" value="${esc(nameOf(p))} (${p.id})">`:""}
  <section><h3>${T("placeKind")}</h3>${radios("kind",[["business",T("kBusiness")],["public",T("kPublic")]],p?.kind==="public"?"public":"business")}<div id="afTypes"></div></section>
  <section><label class="f" for="afName">${T("name")}<input class="inp" id="afName" name="place_name" value="${p?esc(p.name||""):""}" placeholder="${T("namePh")}"></label></section>
  <section><h3>${T("loc")}</h3><div class="minimap" id="miniMap"></div>
    <div class="locrow"><button type="button" class="btn sm dark" id="afLoc"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>${T("useMyLoc")}</button><span class="hint">${T("pinHint")}</span></div>
    <label class="f" for="afAddr">${T("addressLabel")}<input class="inp" id="afAddr" name="address" placeholder="${T("locPh")}"></label></section>
  <section><h3>${T("space")}</h3>${radios("space",[["men",T("men")],["women",T("women")],["both",T("both")]],p?.space)}
    <label class="f" for="afCap">${T("capLabel")}<input class="inp" id="afCap" name="capacity" type="number" inputmode="numeric" min="1" max="2000" style="max-width:140px"></label></section>
  <section><h3>${T("amenitiesQ")}</h3><div class="opts">${AM.map(a=>`<label class="opt"><input type="checkbox" name="has_${a}" value="yes">${T(a)}</label>`).join("")}</div>
    <label class="f" for="afHours">${T("hours")}<input class="inp" id="afHours" name="opening_hours" placeholder="${T("hoursPh")}"></label></section>
  <section><label class="f" for="afDesc">${T("desc")}<textarea class="inp" id="afDesc" name="description" maxlength="1000" placeholder="${T("descPh")}"></textarea></label></section>
  <section><h3>${T("photos")}</h3><label class="photo-drop" for="afPhotos" id="afDrop">${T("photoHint")}</label><input type="file" id="afPhotos" name="attachment" accept="image/*" multiple hidden><div class="hint">${T("photoMax")}</div></section>
  <section><h3>${T("ownerQ")}</h3>${radios("is_owner_or_manager",[["yes",T("yes")],["no",T("no")]],owner?"yes":"no")}
    <div id="ownerBox" class="subbox"><h3>${T("role")}</h3>${radios("role",[["owner",T("owner")],["manager",T("manager")],["employee",T("employee")]],"owner")}
    <label class="f" for="afNote">${T("ownerNoteLabel")}<textarea class="inp" id="afNote" name="owner_note" maxlength="300" placeholder="${T("ownerNotePh")}"></textarea></label></div></section>
  <section><h3>${T("yourDetails")}</h3><div class="hint">${T("yourDetailsHint")}</div>
    <label class="f" for="afYou">${T("yourName")}<input class="inp" id="afYou" name="name" autocomplete="name"></label>
    <label class="f" for="afMail">${T("email")}<input class="inp" id="afMail" name="email" type="email" autocomplete="email" inputmode="email"></label>
    <label class="f" for="afTel">${T("phoneOpt")}<input class="inp" id="afTel" name="phone" type="tel" autocomplete="tel"></label></section>
  <section><label class="check" for="afOk"><input type="checkbox" id="afOk" name="confirmed_rules" value="yes"><span>${T("confirmBox")}</span></label></section>
  </form>`;
  $("#formFoot").innerHTML=`<button class="btn primary" type="submit" form="addForm" id="afSend">${T("send")}</button>`;
  const f=$("#addForm");
  const drawTypes=()=>{$("#afTypes").innerHTML=`<h3 style="margin-top:6px">${T("typeQ")}</h3>`+radios("type",TYPES(f.kind.value).map(v=>[v,T(v)]),p?.type)};
  drawTypes(); f.addEventListener("change",e=>{if(e.target.name==="kind")drawTypes();if(e.target.name==="is_owner_or_manager")$("#ownerBox").hidden=f.is_owner_or_manager.value!=="yes";e.target.closest(".err")?.classList.remove("err")});
  $("#ownerBox").hidden=!owner;
  $("#afAddr").addEventListener("input",()=>{addrDirty=true});
  addrDirty=false;
  // mini map
  openPanel("#pForm");
  setTimeout(()=>initMiniMap(p),320);
  $("#afLoc").onclick=pinToMe;
  $("#afPhotos").onchange=e=>shrinkPhotos(e.target);
  f.addEventListener("submit",e=>{
    const bad=[];
    const need=(el,ok)=>{if(!ok){(el.closest(".opts")||el).classList.add("err");bad.push(el)}};
    need(f.querySelector('[name="kind"]'),!!f.kind.value);
    need($("#afName"),$("#afName").value.trim().length>1);
    need($("#afAddr"),$("#afAddr").value.trim().length>3);
    need(f.querySelector('[name="space"]'),!!f.space.value);
    need($("#afCap"),+$("#afCap").value>0);
    need($("#afYou"),$("#afYou").value.trim().length>1);
    need($("#afMail"),/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($("#afMail").value.trim()));
    need($("#afOk").closest(".check"),$("#afOk").checked);
    if(bad.length){e.preventDefault();toast(T("required"));{const pb=$("#formBody"),el=bad[0].closest(".opts")||bad[0];pb.scrollTo({top:pb.scrollTop+el.getBoundingClientRect().top-pb.getBoundingClientRect().top-90,behavior:"smooth"})}return}
    const b=$("#afSend");b.disabled=true;b.textContent=T("sending");
  });
}
function setPin(lat,lon,fill){
  $("#afLat").value=lat.toFixed(6);$("#afLon").value=lon.toFixed(6);
  $("#afLink").value=`https://www.openstreetmap.org/?mlat=${lat.toFixed(6)}&mlon=${lon.toFixed(6)}#map=19/${lat.toFixed(6)}/${lon.toFixed(6)}`;
  if(miniPin)miniPin.setLatLng([lat,lon]);
  if(fill||!addrDirty)reverseGeocode(lat,lon,fill);
}
let rgTimer;
function reverseGeocode(lat,lon,announce){clearTimeout(rgTimer);rgTimer=setTimeout(async()=>{
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=${lat}&lon=${lon}&accept-language=${lang==="ar"?"ar,en":"en"}`);
    const j=await r.json();const a=j.address||{};
    const line=[[a.house_number,a.road].filter(Boolean).join(" "),[a.postcode,a.city||a.town||a.village||a.suburb].filter(Boolean).join(" "),a.country].filter(Boolean).join(", ");
    if(line&&(announce||!addrDirty)){$("#afAddr").value=line;addrDirty=false;$("#afAddr").classList.remove("err");if(announce)toast(T("locFill"))}
  }catch(e){}},700)}
function initMiniMap(p){
  const el=$("#miniMap"); if(!el)return;
  if(miniMap){miniMap.remove();miniMap=null}
  const start=p?[p.lat,p.lon]:USER||[map.getCenter().lat,map.getCenter().lng];
  miniMap=L.map(el,{zoomControl:true,attributionControl:false,maxZoom:MAXZ,minZoom:EMBED?7:3}).setView(start,p||USER?Math.min(MAXZ,17):Math.min(MAXZ,13));
  (EMBED?new Local("",{maxNativeZoom:13,minZoom:7,maxZoom:13}):L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19})).addTo(miniMap);
  miniPin=L.marker(start,{draggable:true,autoPan:true,icon:L.divIcon({html:'<div class="pin"><svg viewBox="0 0 34 42"><path d="M17 41s14-13.2 14-24A14 14 0 0 0 3 17c0 10.8 14 24 14 24z" fill="var(--accent)" stroke="#fff" stroke-width="2"/><circle cx="17" cy="16" r="5" fill="#fff"/></svg></div>',className:"",iconSize:[34,42],iconAnchor:[17,41]})}).addTo(miniMap);
  miniPin.on("dragend",()=>{const ll=miniPin.getLatLng();setPin(ll.lat,ll.lng,false)});
  miniMap.on("click",e=>setPin(e.latlng.lat,e.latlng.lng,false));
  setPin(start[0],start[1],false);
}
function pinToMe(){
  const go=(lat,lon)=>{miniMap&&miniMap.setView([lat,lon],Math.min(MAXZ,18));setPin(lat,lon,true)};
  if(!("geolocation" in navigator)){toast(T("locUnavail"));return}
  const b=$("#afLoc");b.classList.add("busy");
  navigator.geolocation.getCurrentPosition(pos=>{b.classList.remove("busy");USER=[pos.coords.latitude,pos.coords.longitude];USER_ACC=pos.coords.accuracy||0;showYou();go(USER[0],USER[1])},
    err=>{b.classList.remove("busy");toast(err.code===1?T("locDenied"):T("locUnavail"))},{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}
async function shrinkPhotos(input){
  const files=[...input.files].slice(0,4); if(!files.length)return;
  const dt=new DataTransfer();
  for(const file of files){
    try{const img=await createImageBitmap(file);const s=Math.min(1,1600/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.8));dt.items.add(new File([blob],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}));
    }catch(e){if(file.size<2.4e6)dt.items.add(file)}
  }
  input.files=dt.files; $("#afDrop").textContent="📷 "+T("photosAdded",dt.files.length);
}
function openReview(p){
  let st=0;
  $("#fTitle").textContent=T("reviewTitle");
  $("#formBody").innerHTML=`<section><div style="font-weight:600">${esc(nameOf(p))}</div><div class="starpick" id="sp">${[1,2,3,4,5].map(i=>`<button data-s="${i}" aria-label="${i}">★</button>`).join("")}</div>
   <label class="f" for="rvText">${T("reviewTitle")}<textarea class="inp" id="rvText" placeholder="${T("reviewPh")}"></textarea></label>
   <label class="photo-drop" for="rvPhoto">${T("addPhotos")}</label><input type="file" id="rvPhoto" accept="image/*" multiple hidden></section>`;
  $("#formFoot").innerHTML=`<button class="btn primary" id="rvPost">${T("post")}</button>`;
  $("#sp").onclick=e=>{const b=e.target.closest("button");if(!b)return;st=+b.dataset.s;[...$("#sp").children].forEach((x,i)=>x.classList.toggle("on",i<st))};
  $("#rvPost").onclick=()=>{if(!st){$("#sp").animate([{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"none"}],200);return}
    (localRevs[p.id]=localRevs[p.id]||[]).unshift({n:lang==="ar"?"أنت":"You",s:st,d:0,t:$("#rvText").value||"—",p:$("#rvPhoto").files.length});
    if(!p.rc){p.rating=st}p.conf=0;closePanels();toast(T("posted"));openDetail(p.id);render()};
  openPanel("#pForm");
}
function openAdmin(){
  $("#fTitle").textContent=T("admin");
  const items=[[T("newPlace"),"Café Medina · Bonnevoie","Yassine"],[T("newPhoto"),"Café Nour","Amina"],[T("bizClaim"),"Le Petit Atlas","owner@…"],[T("newPlace"),"Prayer room · Howald","Karim"]];
  $("#formBody").innerHTML=`<section><div class="notice blue">${T("adminIntro")}</div></section><section>${items.map((it,i)=>`<div class="q" id="qi${i}"><div class="meta"><span class="tag ex">${T("pending")}</span><span>${it[0]}</span></div><div style="font-weight:600">${esc(it[1])}</div><div style="color:var(--ink-3);font-size:13px">${T("by")} ${esc(it[2])}</div><div class="row"><button class="btn sm primary" data-ok="${i}">${T("approve")}</button><button class="btn sm" data-no="${i}">${T("reject")}</button></div></div>`).join("")}</section>`;
  $("#formFoot").innerHTML="";
  $("#formBody").onclick=e=>{const b=e.target.closest("[data-ok],[data-no]");if(!b)return;const i=b.dataset.ok??b.dataset.no;$("#qi"+i).remove();toast(b.dataset.ok!=null?T("approved"):T("rejected"))};
  openPanel("#pForm");
}

// ---------- panels / toast ----------
function openPanel(sel){document.querySelectorAll(".panel").forEach(p=>{const on=p.matches(sel);p.classList.toggle("open",on);p.setAttribute("aria-hidden",!on)})}
function closePanels(){document.querySelectorAll(".panel").forEach(p=>{p.classList.remove("open");p.setAttribute("aria-hidden","true")});selected=null;drawMarkers(filtered())}
let tt;function toast(m,ms=2600){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),ms)}

// ---------- events ----------
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-close]"); if(c){closePanels();return}
  const k=e.target.closest("[data-kind]"); if(k){F.kind=k.dataset.kind;render();return}
  const card=e.target.closest(".card"); if(card){openDetail(card.dataset.id);return}
  const o=e.target.closest("#filterBody .opt"); if(o){const key=o.dataset.f,v=isNaN(+o.dataset.v)?o.dataset.v:+o.dataset.v;
    if(o.dataset.m==="true"){F[key]=F[key].includes(v)?F[key].filter(x=>x!==v):[...F[key],v]} else if(o.dataset.m==="bool"){F[key]=!F[key]} else F[key]=v; render();return}
  if(e.target.closest("#mosqChip")){F.mosques=!F.mosques;render();return}
  if(e.target.closest("#clearF")){F=JSON.parse(JSON.stringify(F0));render();return}
  const single=e.target.closest("[data-bt],[data-br],[data-bs]"); if(single){const attr=["bt","br","bs"].find(a=>single.dataset[a]!=null);single.parentElement.querySelectorAll(`[data-${attr}]`).forEach(b=>b.setAttribute("aria-pressed",b===single));return}
});
$("#resetF").onclick=()=>{F=JSON.parse(JSON.stringify(F0));render()};
$("#filterBtn").onclick=()=>openPanel("#pFilters");
$("#q").oninput=e=>{query=e.target.value;render()};
$("#sort").onchange=e=>{sort=e.target.value;render()};

$("#langBtn").onclick=()=>{lang=lang==="en"?"ar":"en";try{localStorage.setItem("pa_lang",lang)}catch(e){};render();if(selected&&$("#pDetail").classList.contains("open"))openDetail(selected)};
// ---------- real location ----------
var locMsg="locBanner"; let youMarker=null, accCircle=null, watchId=null, locBusy=false;
function showYou(){const ll=L.latLng(USER[0],USER[1]);
  if(!youMarker){accCircle=L.circle(ll,{radius:USER_ACC,color:"#2f6fdf",weight:1,fillColor:"#2f6fdf",fillOpacity:.12,interactive:false}).addTo(map);
    youMarker=L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#2f6fdf",fillOpacity:1}).addTo(map).bindTooltip(T("youAreHere"))}
  else{youMarker.setLatLng(ll);accCircle.setLatLng(ll).setRadius(USER_ACC)}}
function onPos(pos,first){USER=[pos.coords.latitude,pos.coords.longitude];USER_ACC=pos.coords.accuracy||0;showYou();$("#locBtn").classList.add("on");
  try{localStorage.setItem("pa_lastpos",JSON.stringify(USER));localStorage.setItem("pa_granted","1")}catch(e){}
  if(first)map.setView(USER,13);$("#locBanner").hidden=true;render()}
function onPosErr(err){locBusy=false;$("#locBtn").classList.remove("busy");
  if(USER)return; // keep last known position
  locMsg=err&&err.code===1?"locDenied":"locUnavail";$("#locBanner").hidden=false;$("#locBannerText").textContent=T(locMsg);$("#locGo").hidden=err&&err.code===1;render()}
function locate(){
  if(!("geolocation" in navigator)){onPosErr({code:2});return}
  if(USER){map.setView(USER,Math.max(map.getZoom(),14));}
  if(locBusy)return; locBusy=true; $("#locBtn").classList.add("busy"); if(!USER)toast(T("locating"));
  navigator.geolocation.getCurrentPosition(pos=>{locBusy=false;$("#locBtn").classList.remove("busy");const first=!USER;onPos(pos,first);
      if(watchId==null)watchId=navigator.geolocation.watchPosition(p=>onPos(p,false),()=>{}, {enableHighAccuracy:true,maximumAge:30000});},
    onPosErr,{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
$("#locBtn").onclick=locate;
$("#locGo").onclick=locate;
map.on("moveend",()=>{if(!USER)render()});
// On load: start where the user was last time, then ask for the real position straight away
// (the browser only shows its prompt if permission isn't already granted; if it was denied we just show the banner).
try{const lp=JSON.parse(localStorage.getItem("pa_lastpos")||"null");if(lp)map.setView(lp,13)}catch(e){}
const IOS_SAFARI=/iP(hone|ad|od)/.test(navigator.userAgent)&&!navigator.standalone;
(async()=>{let state="prompt";
  try{if(navigator.permissions&&navigator.permissions.query){state=(await navigator.permissions.query({name:"geolocation"})).state}}catch(e){}
  if(state==="denied"){onPosErr({code:1});return}
  // iPhone Safari forgets the choice: if we were allowed before and it asks again, show a one-time tip
  let wasGranted=false;try{wasGranted=localStorage.getItem("pa_granted")==="1"}catch(e){}
  if(IOS_SAFARI&&wasGranted&&state!=="granted"){let shown=false;try{shown=localStorage.getItem("pa_iostip")==="1"}catch(e){}
    if(!shown)setTimeout(showIosTip,4000)}
  locate()})();
function showIosTip(){const d=document.createElement("div");d.className="iostip";d.innerHTML=`<p>${T("iosTip")}</p><button class="btn sm dark">${T("gotIt")}</button>`;
  d.querySelector("button").onclick=()=>{d.remove();try{localStorage.setItem("pa_iostip","1")}catch(e){}};$("#app").appendChild(d)}
// Add button: long menu kept simple — first tap suggests a place; extra entry points below the list
$("#addBtn").onclick=()=>openAddForm(null,false);
// ---------- bottom sheet: drag with finger/mouse, 3 snap points ----------
const sheet=$("#sheet"); let sheetState="min", sheetY=0;
const PEEK=96;
function snaps(){const H=sheet.offsetHeight,app=$("#app").clientHeight;return {full:0,half:Math.max(0,H-app*.52),min:Math.max(0,H-PEEK)}}
function placeFab(){const fab=$("#fab");if(window.innerWidth>=900){fab.style.bottom="24px";fab.style.opacity=1;return}
  const app=$("#app").getBoundingClientRect(),r=sheet.getBoundingClientRect();fab.style.bottom=(app.bottom-r.top+12)+"px";fab.style.opacity=r.top<app.top+app.height*.4?0:1;fab.style.pointerEvents=fab.style.opacity==="0"?"none":""}
function setSheet(state,anim=true){sheetState=state;sheetY=snaps()[state];sheet.classList.toggle("dragging",!anim);sheet.style.transform=`translateY(${sheetY}px)`;sheet.classList.toggle("min",state==="min");if(!anim)placeFab()}
sheet.addEventListener("transitionend",placeFab);
let drag=null;
sheet.addEventListener("pointerdown",e=>{const h=e.target.closest(".grab,.sheet-head");if(!h||e.target.closest("select,button:not(.grab)"))return;
  drag={y0:e.clientY,s0:sheetY,t0:performance.now(),last:e.clientY,lt:performance.now(),v:0,moved:false,id:e.pointerId};sheet.setPointerCapture(e.pointerId);sheet.classList.add("dragging")});
sheet.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;const dy=e.clientY-drag.y0;if(Math.abs(dy)>4)drag.moved=true;
  const now=performance.now();drag.v=(e.clientY-drag.last)/Math.max(1,now-drag.lt);drag.last=e.clientY;drag.lt=now;
  sheetY=Math.min(snaps().min,Math.max(0,drag.s0+dy));sheet.style.transform=`translateY(${sheetY}px)`;placeFab()});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;sheet.classList.remove("dragging");const d=drag;drag=null;
  if(!d.moved){setSheet(sheetState==="min"?"half":sheetState==="half"?"full":"min");return}
  const s=snaps(),target=sheetY+d.v*220;let best="min",bd=1e9;for(const k in s){const dd=Math.abs(s[k]-target);if(dd<bd){bd=dd;best=k}}setSheet(best)}
sheet.addEventListener("pointerup",endDrag);sheet.addEventListener("pointercancel",endDrag);
window.addEventListener("resize",()=>setSheet(sheetState,false));
// list scrolled to top + pull down => collapse
let pull=null;$("#list").addEventListener("touchstart",e=>{pull=$("#list").scrollTop<=0?e.touches[0].clientY:null},{passive:true});
$("#list").addEventListener("touchend",e=>{if(pull!=null&&e.changedTouches[0].clientY-pull>70)setSheet(sheetState==="full"?"half":"min");pull=null},{passive:true});
if(location.hash==="#sent"){try{history.replaceState(null,"",location.pathname)}catch(e){}setTimeout(()=>toast(T("sentOk"),5000),700)}
// extra links at end of list
const _render=render; render=function(){_render();$("#list").insertAdjacentHTML("beforeend",`<div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:6px"><button class="btn sm" id="bizLink">${T("forBiz")}</button><button class="btn sm" id="adminLink">${T("admin")}</button></div>`);$("#bizLink").onclick=()=>openAddForm(null,true);$("#adminLink").onclick=openAdmin;placeFab()};
render();
setSheet("min",false);
</script>
